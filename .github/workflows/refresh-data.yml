name: Refresh data

# Re-imports the benchmark and plan data every day and opens or updates one
# standing PR when anything beyond fetch dates changed. A failed run opens or
# updates the "Data refresh failing" issue; the next good run closes it.

on:
  schedule:
    # After slopalytics' daily refresh at 02:17 UTC, so each run reads its latest catalog.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      allow-score-drift:
        description: "Pass --allow-score-drift (AA regraded a benchmark)"
        type: boolean
        default: false
      allow-missing-cost:
        description: "Pass --allow-missing-cost (publish uncosted models)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh data
    runs-on: ubuntu-latest
    # Pushes and the PR go through DATA_REFRESH_TOKEN, so Verify runs on them
    # (GITHUB_TOKEN events start no workflows). GITHUB_TOKEN only files the issue.
    permissions:
      contents: read
      issues: write
    env:
      BASE: ${{ github.ref_name }}
      # Cut fresh from the base each run; a branch of its own per base keeps
      # test runs off the production standing PR.
      BRANCH: data-refresh/${{ github.ref_name }}
      ISSUE_TITLE: ${{ github.ref_name == 'main' && 'Data refresh failing' || format('Data refresh failing on {0}', github.ref_name) }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      STEP_LOG: ${{ runner.temp }}/step.log
      STEP_NAME: ${{ runner.temp }}/step.name
      SUMMARY: ${{ runner.temp }}/summary.md

    steps:
      - name: Check the refresh token
        env:
          TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          echo "Check the refresh token" > "$STEP_NAME"
          if [ -z "$TOKEN" ]; then
            msg="The DATA_REFRESH_TOKEN repository secret is missing. Add a fine-grained personal access token for NavHur/slopsubs with Contents and Pull requests set to Read and write. The refresh needs it so Verify runs on its PR; GITHUB_TOKEN events start no workflows."
            echo "$msg" > "$STEP_LOG"
            echo "::error title=DATA_REFRESH_TOKEN missing::$msg"
            exit 1
          fi
          echo "Check out and set up Vite+" > "$STEP_NAME"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.DATA_REFRESH_TOKEN }}

      # Installs vp, Node.js, and the bun pinned in package.json, then runs
      # `vp install` against bun.lock.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Import data
        id: refresh
        env:
          ALLOW_SCORE_DRIFT: ${{ inputs.allow-score-drift }}
          ALLOW_MISSING_COST: ${{ inputs.allow-missing-cost }}
        run: |
          echo "Import data" > "$STEP_NAME"
          set -o pipefail
          flags=()
          if [ "$ALLOW_SCORE_DRIFT" = true ]; then flags+=(--allow-score-drift); fi
          if [ "$ALLOW_MISSING_COST" = true ]; then flags+=(--allow-missing-cost); fi
          bun run refresh-data "${flags[@]}" --summary "$SUMMARY" 2>&1 | tee "$STEP_LOG"

      - name: Check the refreshed data
        if: steps.refresh.outputs.changed == 'true'
        run: |
          echo "Check the refreshed data" > "$STEP_NAME"
          set -o pipefail
          { vp check && vp test run; } 2>&1 | tee "$STEP_LOG"

      # Skips the push when the standing PR already has these numbers on the
      # current base, so a rerun changes nothing.
      - name: Compare with the standing PR
        id: standing
        if: steps.refresh.outputs.changed == 'true'
        run: |
          echo "Compare with the standing PR" > "$STEP_NAME"
          set -o pipefail
          # Exit 2 means the branch is absent; any other failure stops the run.
          status=0
          git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null || status=$?
          if [ "$status" = 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
          git fetch --quiet --depth=2 origin "$BRANCH"
          if [ "$(git rev-parse FETCH_HEAD^)" = "$(git rev-parse HEAD)" ]; then
            bun scripts/data-changes.ts FETCH_HEAD 2>&1 | tee "$STEP_LOG"
          else
            echo "Base moved since the standing PR; republishing." | tee "$STEP_LOG"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the refresh PR
        if: steps.standing.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          echo "Publish the refresh PR" > "$STEP_NAME"
          set -o pipefail
          {
            git config user.name "slopsubs data refresh"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git switch --create "$BRANCH"
            git commit --all --quiet --message "chore(data): refresh benchmark and plan data"
            git push --force origin "$BRANCH"

            body="$RUNNER_TEMP/body.md"
            { echo "What changed since \`$BASE\`:"; echo; cat "$SUMMARY"; echo; echo "From [this run]($RUN_URL)."; } > "$body"
            title="chore(data): refresh benchmark and plan data"
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=$BASE&state=open" --jq '.[0].number // empty')
            if [ -n "$pr" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -f title="$title" -F body=@"$body" --jq .html_url
            else
              gh api "repos/$GITHUB_REPOSITORY/pulls" -f title="$title" -f head="$BRANCH" -f base="$BASE" -F draft=true -F body=@"$body" --jq .html_url
            fi
          } 2>&1 | tee "$STEP_LOG"

      # Upstream went back to what the base already has, so the open PR's
      # numbers are no longer news.
      - name: Close a stale refresh PR
        if: steps.refresh.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.DATA_REFRESH_TOKEN }}
        run: |
          echo "Close a stale refresh PR" > "$STEP_NAME"
          set -o pipefail
          {
            for pr in $(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$GITHUB_REPOSITORY_OWNER:$BRANCH&base=$BASE&state=open" --jq '.[].number'); do
              gh api "repos/$GITHUB_REPOSITORY/issues/$pr/comments" -f body="Closing: [this run]($RUN_URL) found the data matches \`$BASE\` again." --silent
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$pr" -f state=closed --silent
              git push --quiet origin --delete "$BRANCH"
              echo "Closed #$pr"
            done
          } 2>&1 | tee "$STEP_LOG"

      - name: Close the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Close the failure issue" > "$STEP_NAME"
          set -o pipefail
          open_failure_issues() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" |
              jq -rs --arg title "$ISSUE_TITLE" 'add[] | select(.title == $title and (.pull_request | not)) | .number'
          }
          for issue in $(open_failure_issues); do
            gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="Fixed: [this run]($RUN_URL) refreshed the data." --silent
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -f state=closed -f state_reason=completed --silent
          done

      - name: Open or update the failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          open_failure_issues() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" |
              jq -rs --arg title "$ISSUE_TITLE" 'add[] | select(.title == $title and (.pull_request | not)) | .number'
          }
          body="$RUNNER_TEMP/issue.md"
          {
            echo "The daily data refresh failed, so the site's data is stale until this is fixed."
            echo
            echo "- Step: **$(cat "$STEP_NAME" 2>/dev/null || echo unknown)**"
            echo "- Run: $RUN_URL"
            echo
            echo "Last lines of its output:"
            echo
            echo '```'
            tail -n 60 "$STEP_LOG" 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo
            echo "The next successful run closes this issue."
          } > "$body"
          issue=$(open_failure_issues | head -n 1)
          if [ -n "$issue" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/$issue" -F body=@"$body" --jq .html_url
          else
            gh api "repos/$GITHUB_REPOSITORY/issues" -f title="$ISSUE_TITLE" -F body=@"$body" --jq .html_url
          fi
