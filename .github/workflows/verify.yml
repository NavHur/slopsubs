name: Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs cancel each other; a main run may be mid-deploy.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: ${{ matrix.name }}
    # GitHub-hosted: free for a public repository, and keeps outside contributors' code off our machines.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Format & lint
            command: vp check
          - name: Typecheck
            command: vp run typecheck
          - name: Tests
            command: vp test run
          - name: Build
            command: vp run build

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs vp, Node.js, and the bun pinned in package.json, then runs
      # `vp install` against bun.lock.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Deploys run one at a time; a newer merge waits instead of cutting one off mid-upload.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://slopsubs.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Installs vp, Node.js, and the bun pinned in package.json, then runs
      # `vp install` against bun.lock.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: 24
          cache: true
          run-install: |
            args:
              - --frozen-lockfile

      - name: Build
        run: vp run build

      - name: Deploy to Cloudflare Workers
        run: vp exec wrangler deploy --message "${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5ea4a6a34a596082ec675da8024215d1
